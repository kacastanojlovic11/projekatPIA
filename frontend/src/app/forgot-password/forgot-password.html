<h2>Zaboravljena lozinka</h2>

<label>Korisničko ime ili email:</label>
<input type="text" [(ngModel)]="identifier">
<br><br>

<button (click)="send()">Napravi reset link</button>
<br><br>

@if (error !== "") {
    <span style="color:red">{{ error }}</span>
}

@if (message !== "") {
    <p>{{ message }}</p>
    <p>Privremeno, za testiranje:</p>
    <a [href]="resetLink">{{ resetLink }}</a>
}
<br><br>

<a routerLink="/">Nazad na prijavu</a>
