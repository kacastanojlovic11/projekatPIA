<h2>Zaboravljena lozinka</h2>

<label>Korisničko ime ili email:</label>
<input type="text" [(ngModel)]="identifier">
<br><br>

<button (click)="send()">Pošalji zahtev za novu lozinku</button>
<br><br>

@if (error !== "") {
    <span class="greska">{{ error }}</span>
}

@if (message !== "") {
    <p>{{ message }}</p>
    <a [href]="resetLink">POSTAVI NOVU LOZINKU</a>
}
<br><br>

<a routerLink="/login">Nazad na prijavu</a>
