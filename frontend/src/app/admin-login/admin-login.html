<h2>Administratorska prijava</h2>
<label>Korisničko ime:</label>

<input type="text" [(ngModel)]="username">
<br><br>

<label>Lozinka:</label>
<input type="password" [(ngModel)]="password">
<br><br>

<button (click)="login()"> Prijavi se</button>
<br><br>

@if (error !== "") {
    <p class="greska">{{ error }}</p>
}
